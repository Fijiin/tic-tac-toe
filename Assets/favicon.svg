<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <!-- Grid lines -->
  <line x1="11" y1="3" x2="11" y2="29" stroke="#a0a0ff" stroke-width="1.5"/>
  <line x1="21" y1="3" x2="21" y2="29" stroke="#a0a0ff" stroke-width="1.5"/>
  <line x1="3"  y1="11" x2="29" y2="11" stroke="#a0a0ff" stroke-width="1.5"/>
  <line x1="3"  y1="21" x2="29" y2="21" stroke="#a0a0ff" stroke-width="1.5"/>
  <!-- X in top-left cell -->
  <line x1="4" y1="4" x2="9" y2="9" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="4" x2="4" y2="9" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <!-- O in centre cell -->
  <circle cx="16" cy="16" r="3" fill="none" stroke="#6bcbff" stroke-width="2"/>
  <!-- X in bottom-right cell -->
  <line x1="23" y1="23" x2="28" y2="28" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="23" x2="23" y2="28" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
</svg>
